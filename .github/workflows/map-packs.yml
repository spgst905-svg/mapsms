name: Build offline map packs

# Manual run: Actions → "Build offline map packs" → Run workflow.
# Publishes *.pmtiles to GitHub Release "maps-v1" (app default download source).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # monthly refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pmtiles CLI
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/
      - name: Extract packs
        run: scripts/build-map-packs.sh dist/maps
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-v1 >/dev/null 2>&1 || gh release create maps-v1 --title "Offline map packs" --notes "PMTiles for MapSMS. Data © OpenStreetMap contributors, Protomaps."
          gh release upload maps-v1 dist/maps/*.pmtiles --clobber
