name: Build App Timer APK

# Separate from the MapSMS workflow. Builds apptimer/ only.
# Release APK is signed with the Expo template debug key (fine for direct install).
# Run: Actions -> "Build App Timer APK" -> Run workflow, or push a tag like apptimer-v1.0.0.
# Download the APK from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['apptimer-v*']
    paths: ['apptimer/**', '.github/workflows/apptimer-apk.yml']
  pull_request:
    paths: ['apptimer/**', '.github/workflows/apptimer-apk.yml']

defaults:
  run:
    working-directory: apptimer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apptimer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  apk:
    needs: check
    # Skip the heavy build on pull requests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apptimer/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Gradle assembleRelease
        working-directory: apptimer/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apptimer-apk
          path: apptimer/android/app/build/outputs/apk/release/*.apk
